<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jonathan Da Silva — Cinematographer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="hero">
        <img
            src="images/homepage-01.png"

        <div class="hero-overlay"></div>

        <header class="site-header">

            <nav class="main-nav" aria-label="Navigation principale">

                <a href="#" class="nav-link">About</a>
                <a href="#" class="nav-link">Portfolio</a>
                <a href="#" class="nav-link">Showreel</a>
                <a href="#" class="nav-link">Contact</a>

                <a
                    href="https://www.instagram.com/jdshemera/"
                    class="instagram-link"
                    target="_blank"
                    rel="noopener noreferrer"

                >
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <rect
                            x="3"
                            y="3"
                            width="18"
                            height="18"
                            rx="5"
                            ry="5"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                        />
                        <circle
                            cx="12"
                            cy="12"
                            r="4"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                        />

                            cx="17.3"
                            cy="6.7"
