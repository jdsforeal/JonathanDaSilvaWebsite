            </div>


            <!-- PORTFOLIO -->

            <div class="nav-item has-dropdown">

            </div>


            <!-- INSTAGRAM -->

            <a
                href="https://www.instagram.com/jdshemera/"
                class="instagram-link"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Instagram"
            >

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <rect
                        x="3"
                        y="3"
                        width="18"
                        height="18"
                        rx="5"
                        ry="5"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                    />

                    <circle
                        cx="12"
                        cy="12"
                        r="4"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                    />

                    <circle
                        cx="17.3"
                        cy="6.7"
                        r="1.2"
                        fill="currentColor"
                    />

                </svg>

            </a>


        </nav>


        <!-- HAMBURGER MOBILE -->

        <button
            class="mobile-menu-toggle"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="mobile-menu"
        >
            <span></span>
            <span></span>
        </button>


    </header>



    <!-- =========================
         MENU MOBILE
         ========================= -->

    <div
        class="mobile-menu"
        id="mobile-menu"
    >

        <nav
            class="mobile-menu-nav"
            aria-label="Mobile navigation"
        >


            <a
                href="../index.html"
                class="mobile-menu-link"
            >
                Home
            </a>


            <!-- ABOUT -->

            <div class="mobile-nav-group">

                <button
                    class="mobile-parent-toggle mobile-submenu-toggle"
                    type="button"
                    aria-label="Open About submenu"
                    aria-expanded="false"
                    aria-controls="mobile-about-submenu"
                >

                    <span>About</span>

                    <span
                        class="mobile-submenu-icon"
                        aria-hidden="true"
                    >
                        +
                    </span>

                </button>


                <div
                    class="mobile-submenu"
                    id="mobile-about-submenu"
                >

                    <div class="mobile-submenu-inner">

                        <a
                            href="../profile.html"
                            class="mobile-submenu-link"
                        >
                            Profile
                        </a>

                        <a
                            href="../full-credits.html"
                            class="mobile-submenu-link"
                        >
                            Full Credits
                        </a>

                    </div>

                </div>

            </div>


            <!-- PORTFOLIO -->

            <div class="mobile-nav-group">

                <div class="mobile-nav-row">

                    <a
                        href="../portfolio.html"
                        class="mobile-menu-link"
                    >
                        Portfolio
                    </a>

                    <button
                        class="mobile-submenu-toggle"
                        type="button"
                        aria-label="Open Portfolio submenu"
                        aria-expanded="false"
                        aria-controls="mobile-portfolio-submenu"
                    >

                        <span
                            class="mobile-submenu-icon"
                            aria-hidden="true"
                        >
                            +
                        </span>

                    </button>

                </div>


                <div
                    class="mobile-submenu"
                    id="mobile-portfolio-submenu"
                >

                    <div class="mobile-submenu-inner">

                        <a
                            href="../films.html"
                            class="mobile-submenu-link"
                        >
                            Films
                        </a>

                        <a
                            href="../music-videos.html"
                            class="mobile-submenu-link"
                        >
                            Music Videos
                        </a>

                        <a
                            href="../commercials.html"
                            class="mobile-submenu-link"
                        >
                            Commercials
                        </a>

                    </div>

                </div>

            </div>


            <a
                href="../showreel.html"
                class="mobile-menu-link"
            >
                Showreel
            </a>

            <a
                href="../contact.html"
                class="mobile-menu-link"
            >
                Contact
            </a>


        </nav>


        <a
            href="https://www.instagram.com/jdshemera/"
            class="mobile-instagram-link"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <rect
                    x="3"
                    y="3"
                    width="18"
                    height="18"
                    rx="5"
                    ry="5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                />

                <circle
                    cx="12"
                    cy="12"
                    r="4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                />

                <circle
                    cx="17.3"
                    cy="6.7"
                    r="1.2"
                    fill="currentColor"
                />

            </svg>

        </a>

    </div>



    <!-- =========================
         CONTENU DU PROJET
         ========================= -->

    <main class="project-content">


        <!-- =========================
            PROJECT INTRO
            ========================= -->

        <section class="project-detail">


            <a
                href="../portfolio.html"
                class="project-back-link"
            >
                ← Back to Portfolio
            </a>


            <header class="project-detail-header">

                <div class="project-heading-line">

                    <h1
                        class="project-detail-title"
                        data-project-title
                    ></h1>

                    <p
                        class="project-detail-secondary"
                        data-project-secondary
                    ></p>

                    <span
                        class="project-heading-rule"
                        aria-hidden="true"
                    ></span>

                </div>

            </header>

            <!-- =========================
                PROJECT GALLERY
                ========================= -->

            <section
                class="project-gallery"
                data-project-gallery-section
            >

                <div class="project-gallery-sticky">


                    <!-- =========================
                        MEDIA TRACK
                        ========================= -->

                    <div class="project-gallery-viewport">

                        <div
                            class="project-gallery-track"
                            data-project-gallery
                        >

                            <!--
                                Les slides sont générées
                                automatiquement par project.js
                            -->

                        </div>

                    </div>


                    <!-- =========================
                        GALLERY INDICATOR
                        ========================= -->

                    <div class="project-gallery-navigation">

                        <div
                            class="project-gallery-progress"
                            aria-hidden="true"
                        >

                            <span
                                class="project-gallery-progress-bar"
                                data-gallery-progress
                            ></span>

                        </div>


                        <p class="project-gallery-counter">

                            <span data-gallery-current>
                                01
                            </span>

                            <span aria-hidden="true">
                                /
                            </span>

                            <span data-gallery-total>
                                01
                            </span>

                        </p>

                    </div>


                </div>

            </section>



            <!-- =========================
                PROJECT DETAILS
                ========================= -->

            <section class="project-details">

                <h2 class="project-details-title">
                    Project Details
                </h2>

                <div
                    class="project-details-content"
                    data-project-details
                ></div>

            </section>

            <!-- =========================
                PROJECT NAVIGATION
                ========================= -->

            <section
                class="project-navigation"
                data-project-navigation
                aria-label="Project navigation"
            ></section>


        </section>


    </main>

        <!-- =========================
        PROJECT LIGHTBOX
        ========================= -->

    <div
        class="project-lightbox"
        data-project-lightbox
        aria-hidden="true"
    >

        <button
            class="project-lightbox-close"
            type="button"
            aria-label="Close image"
            data-lightbox-close
        >
            ×
        </button>


        <button
            class="project-lightbox-arrow project-lightbox-arrow-left"
            type="button"
            aria-label="Previous image"
            data-lightbox-prev
        >
            ←
        </button>


        <div class="project-lightbox-media">

            <img
                class="project-lightbox-image"
                data-lightbox-image
                src=""
                alt=""
            >

        </div>


        <button
            class="project-lightbox-arrow project-lightbox-arrow-right"
            type="button"
            aria-label="Next image"
            data-lightbox-next
        >
            →
        </button>


        <p class="project-lightbox-counter">

            <span data-lightbox-current>
                01
            </span>

            <span aria-hidden="true">
                /
            </span>

            <span data-lightbox-total>
                01
            </span>

        </p>

    </div>



    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script src="../projects.js"></script>
    <script src="../project.js"></script>
    <script src="../navigation.js"></script>


</body>
